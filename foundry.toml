# The contracts of Thinkr: the deposit addresses of the claims by transfer of holder vouchers (27 Oct 2026).
# Robinhood Chain (4663) runs the opcodes of Cancun: PUSH0, MCOPY, and TSTORE answered there on 27 Oct 2026.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[fmt]
line_length = 100
